<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu painel de finanças</title>
<meta name="description" content="Painel pessoal para acompanhar gastos, contas fixas, parcelas e reserva do mês.">
<meta name="theme-color" content="#0F3B44">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<style>
  :root{
    --bg:#EAEDF1; --surface:#FFFFFF; --sub:#F7F9FB; --line:#D7DDE5; --line-soft:#EDF0F4;
    --ink:#17202E; --ink-2:#5A6779; --ink-3:#8E99A8;
    --petrol:#0F3B44; --petrol-2:#17555F; --petrol-txt:#EAF3F1; --petrol-mut:#9BBDBB;
    --pos:#2E7D5B; --pos-bg:#E7F3ED; --warn:#B7791F; --warn-bg:#FBF2E1;
    --dang:#A63D33; --dang-bg:#FBEAE8; --neutro-bg:#EFF2F6;
    --trilho:#E7EBF0; --barra-dia:#B9C6D2;
  }
  body.escuro{
    --bg:#12181F; --surface:#1B222B; --sub:#212A34; --line:#2E3945; --line-soft:#262F3A;
    --ink:#E4EAF1; --ink-2:#9AA7B6; --ink-3:#6E7C8C;
    --petrol:#0B2E36; --petrol-2:#17555F; --petrol-txt:#DCEBE8; --petrol-mut:#82A8A6;
    --pos:#5FBF92; --pos-bg:#1B3A2C; --warn:#D9A441; --warn-bg:#3A2E17;
    --dang:#E28579; --dang-bg:#3B2320; --neutro-bg:#2A333E;
    --trilho:#2C3742; --barra-dia:#3E4C5A;
  }
  *{box-sizing:border-box}
  html{color-scheme:light}
  body.escuro{color-scheme:dark}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px; margin:0 auto; padding:20px 16px 64px}
  h1{font-size:19px; font-weight:650; letter-spacing:-.01em; margin:0}
  h2{font-size:14px; font-weight:650; margin:0; letter-spacing:-.005em}
  .num{font-variant-numeric:tabular-nums}
  button{font:inherit; cursor:pointer}
  input,select{font:inherit; color:var(--ink)}
  input,select{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:8px 10px; width:100%; min-width:0}
  input::placeholder{color:var(--ink-3)}
  input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--petrol-2); outline-offset:1px}
  .muted{color:var(--ink-2)} .tiny{font-size:12.5px}

  .top{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:16px}
  .mes{display:flex; align-items:center; gap:2px; margin-left:auto}
  .mes b{min-width:132px; text-align:center; font-weight:600; font-size:14px; text-transform:capitalize}
  .ghost{background:transparent; border:1px solid var(--line); border-radius:8px; padding:6px 10px; color:var(--ink-2)}
  .ghost:hover{background:var(--surface); color:var(--ink)}
  .estado{font-size:12px; color:var(--ink-3)}
  .nuvem{display:flex; align-items:center; gap:6px; font-size:12px; padding:4px 10px; border-radius:99px; border:1px solid var(--line); background:transparent; color:var(--ink-2)}
  .nuvem i{width:7px; height:7px; border-radius:99px; background:var(--ink-3); flex:none}
  .nuvem.ok i{background:var(--pos)}
  .nuvem.ocupado i{background:var(--warn)}
  .nuvem.off i{background:var(--dang)}

  .hero{background:var(--petrol); color:var(--petrol-txt); border-radius:14px; padding:22px 22px 18px; margin-bottom:14px}
  .hero-top{display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap}
  .hero label{display:block; font-size:13px; color:var(--petrol-mut); margin-bottom:2px}
  .big{font-size:clamp(34px,7vw,52px); font-weight:680; letter-spacing:-.03em; line-height:1}
  .big.neg{color:#F0A79E}
  .porDia{text-align:right}
  .porDia .v{font-size:20px; font-weight:640; letter-spacing:-.02em}
  .barra{height:9px; background:rgba(255,255,255,.16); border-radius:99px; margin:18px 0 10px; overflow:hidden; display:flex}
  .barra i{display:block; height:100%}
  .legenda{display:flex; gap:16px; flex-wrap:wrap; font-size:12.5px}
  .legenda span{display:flex; align-items:center; gap:6px; color:var(--petrol-mut)}
  .dot{width:8px; height:8px; border-radius:3px; flex:none}

  .fita{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px 10px; margin-bottom:14px}
  .fita-head{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:10px}
  .dias{display:flex; gap:2px; align-items:flex-end; height:64px}
  .dia{flex:1; display:flex; flex-direction:column; justify-content:flex-end; height:100%}
  .dia .b{background:var(--barra-dia); border-radius:2px 2px 0 0; min-height:2px}
  .dia.hoje .b{background:var(--petrol-2)}
  .marcas{display:flex; gap:2px; margin-top:4px}
  .marca{flex:1; height:12px; display:flex; align-items:center; justify-content:center}
  .marca i{width:6px; height:6px; border-radius:99px; display:block}
  .escala{display:flex; justify-content:space-between; font-size:11px; color:var(--ink-3); margin-top:2px}

  .grade{display:grid; grid-template-columns:1.15fr .85fr; gap:14px; align-items:start}
  @media (max-width:820px){ .grade{grid-template-columns:1fr} }
  .col{display:flex; flex-direction:column; gap:14px}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden}
  .card > header{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:13px 16px; border-bottom:1px solid var(--line-soft)}
  .card .corpo{padding:14px 16px}

  .form-gasto{display:grid; grid-template-columns:110px 1fr; gap:8px; padding:14px 16px; background:var(--sub); border-bottom:1px solid var(--line-soft)}
  .form-gasto .linha2{grid-column:1/-1; display:grid; grid-template-columns:1fr 74px 96px; gap:8px}
  .add{background:var(--petrol-2); color:#F2F8F7; border:0; border-radius:8px; padding:9px 12px; font-weight:600}
  .add:hover{filter:brightness(1.12)}

  ul{list-style:none; margin:0; padding:0}
  li.item{display:flex; align-items:center; gap:10px; padding:10px 16px; border-bottom:1px solid var(--line-soft)}
  li.item:last-child{border-bottom:0}
  .nome{flex:1; min-width:0}
  .nome span{display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .val{font-weight:600; white-space:nowrap}
  .x{background:transparent; border:0; color:var(--ink-3); padding:2px 4px; font-size:16px; line-height:1; border-radius:6px}
  .x:hover{color:var(--dang); background:var(--dang-bg)}
  .dia-cabec{padding:9px 16px 3px; font-size:12px; color:var(--ink-3); background:var(--sub); border-bottom:1px solid var(--line-soft)}
  .cat{width:9px; height:9px; border-radius:3px; flex:none}
  .vazio{padding:20px 16px; color:var(--ink-2); font-size:13.5px}

  .tag{font-size:11.5px; font-weight:600; padding:2px 7px; border-radius:99px; white-space:nowrap}
  .tag.pago{color:var(--pos); background:var(--pos-bg)}
  .tag.vence{color:var(--warn); background:var(--warn-bg)}
  .tag.atras{color:var(--dang); background:var(--dang-bg)}
  .tag.aberto{color:var(--ink-2); background:var(--neutro-bg)}
  .check{width:20px; height:20px; border:1.5px solid var(--line); border-radius:6px; background:var(--surface); flex:none; padding:0; color:transparent}
  .check[aria-pressed="true"]{background:var(--pos); border-color:var(--pos); color:#0E2A1E}
  .check svg{display:block; margin:auto}

  .editavel{width:96px; text-align:right; font-weight:600; padding:5px 6px; background:transparent; border:1px solid transparent; border-radius:7px; font-variant-numeric:tabular-nums}
  .editavel:hover{border-color:var(--line); background:var(--sub)}
  .editavel:focus{border-color:var(--petrol-2); background:var(--surface)}
  .conta-linha{display:flex; align-items:center; gap:10px; padding:9px 16px; border-bottom:1px solid var(--line-soft)}
  .conta-linha:last-of-type{border-bottom:0}
  .sub-nome{font-size:11.5px; color:var(--ink-3)}

  .divida{padding:12px 16px; border-bottom:1px solid var(--line-soft)}
  .divida:last-child{border-bottom:0}
  .l1{display:flex; align-items:center; gap:10px}
  .prog{height:6px; background:var(--trilho); border-radius:99px; margin:9px 0 8px; overflow:hidden; display:flex}
  .prog i{display:block; height:100%}
  .prog .antes{background:var(--petrol-2)}
  .prog .agora{background:var(--pos)}
  .stepper{display:flex; align-items:center; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--surface)}
  .stepper button{border:0; background:transparent; color:var(--ink-2); width:30px; height:28px; font-weight:700; font-size:15px; padding:0}
  .stepper button:hover:not(:disabled){background:var(--sub); color:var(--ink)}
  .stepper button:disabled{opacity:.35; cursor:default}
  .stepper .q{min-width:78px; text-align:center; font-size:12px; font-weight:600; padding:0 4px; border-left:1px solid var(--line); border-right:1px solid var(--line); line-height:28px}
  .stepper.ativo{border-color:var(--pos)}
  .stepper.ativo .q{color:var(--pos); border-color:var(--pos)}

  .catlinha{display:grid; grid-template-columns:1fr auto; gap:4px 10px; margin-bottom:11px}
  .catbar{grid-column:1/-1; height:6px; background:var(--trilho); border-radius:99px; overflow:hidden}
  .catbar i{display:block; height:100%}

  .mini{display:grid; gap:8px; padding:12px 16px; background:var(--sub); border-top:1px solid var(--line-soft)}
  .mini .l{display:grid; grid-template-columns:1fr 92px 68px minmax(44px,auto); gap:8px}
  .mini .l3{display:grid; grid-template-columns:1fr 84px 64px 64px minmax(44px,auto); gap:8px}
  @media (max-width:520px){
    .mini .l,.mini .l3{grid-template-columns:1fr 1fr}
    .form-gasto{grid-template-columns:1fr 1fr}
    .form-gasto .linha2{grid-template-columns:1fr 1fr}
  }
  .abrir{background:transparent; border:0; color:var(--petrol-2); font-weight:600; font-size:13px; padding:0; text-align:left}
  body.escuro .abrir{color:#7FD8BC}
  .abrir:hover{text-decoration:underline}
  .linha-botoes{display:flex; gap:8px; flex-wrap:wrap}

  .nome-btn{background:transparent; border:0; padding:0; color:inherit; text-align:left; border-radius:4px}
  .nome-btn:hover span:first-child{text-decoration:underline; text-decoration-color:var(--ink-3); text-underline-offset:3px}
  li.item.editando,.conta-linha.editando{background:var(--warn-bg)}
  .editando-aviso{grid-column:1/-1; color:var(--warn)}
  .var{font-weight:600; color:var(--ink-3)}
  .var.sobe{color:var(--dang)} .var.desce{color:var(--pos)}
  .aviso{position:fixed; left:16px; right:16px; bottom:20px; margin:0 auto; width:fit-content; z-index:10; display:flex; align-items:center; gap:14px;
    padding:10px 12px 10px 16px; border-radius:10px; background:var(--ink); color:var(--surface);
    font-size:13.5px; box-shadow:0 6px 24px rgba(0,0,0,.25)}
  .aviso button{background:transparent; border:0; color:#7FD8BC; font-weight:650; padding:2px 4px; white-space:nowrap}
  body.escuro .aviso button{color:var(--petrol-2)}
  [hidden]{display:none !important}
  @media (prefers-reduced-motion:reduce){ *{transition:none !important} }
</style>

<div class="wrap">
  <div class="top">
    <h1>Meu painel</h1>
    <button class="nuvem" id="nuvem" hidden title="Sincronizar agora"><i></i><span id="nuvemTxt">Drive</span></button>
    <span class="estado" id="estado"></span>
    <div class="mes">
      <button class="ghost" id="btnTema" aria-label="Alternar modo escuro"><span id="iconeTema">☾</span></button>
      <button class="ghost" id="ant" aria-label="Mês anterior">‹</button>
      <b id="rotuloMes" class="num"></b>
      <button class="ghost" id="prox" aria-label="Próximo mês">›</button>
      <button class="ghost" id="hoje">Hoje</button>
    </div>
  </div>

  <section class="hero">
    <div class="hero-top">
      <div>
        <label id="heroLabel">Livre para gastar até o fim do mês</label>
        <div class="big num" id="livre">R$ 0,00</div>
      </div>
      <div class="porDia">
        <label id="porDiaLabel">Por dia</label>
        <div class="v num" id="porDia">R$ 0,00</div>
      </div>
    </div>
    <div class="barra" id="barra"></div>
    <div class="legenda" id="legenda"></div>
  </section>

  <section class="fita">
    <div class="fita-head">
      <h2>Fita do mês</h2>
      <span class="tiny muted" id="fitaResumo"></span>
    </div>
    <div class="dias" id="dias"></div>
    <div class="marcas" id="marcas"></div>
    <div class="escala"><span>dia 1</span><span id="ultimoDia">dia 30</span></div>
  </section>

  <div class="grade">
    <div class="col">
      <div class="card">
        <header>
          <h2>Gastos do dia a dia</h2>
          <span class="tiny muted num" id="totalGastos"></span>
        </header>
        <div class="form-gasto">
          <input id="gValor" inputmode="decimal" placeholder="45,90" aria-label="Valor">
          <input id="gDesc" placeholder="No que foi?" aria-label="Descrição">
          <div class="linha2">
            <select id="gCat" aria-label="Categoria"></select>
            <input id="gDia" type="number" min="1" max="31" aria-label="Dia">
            <button class="add" id="gAdd">Lançar</button>
          </div>
          <div class="editando-aviso tiny" id="gEditando" hidden>Editando um gasto · <button class="abrir" id="gCancelar">cancelar</button></div>
        </div>
        <ul id="listaGastos"></ul>
      </div>

      <div class="card">
        <header><h2>Para onde foi o dinheiro</h2><span class="tiny muted num" id="compara"></span></header>
        <div class="corpo" id="categorias"></div>
      </div>
    </div>

    <div class="col">
      <div class="card">
        <header>
          <h2>Contas fixas</h2>
          <span class="tiny muted num" id="totalContas"></span>
        </header>
        <div id="listaContas"></div>
        <div class="mini">
          <button class="abrir" id="abrirConta">+ Nova conta fixa</button>
          <div class="l" id="formConta" hidden>
            <input id="cNome" placeholder="Aluguel" aria-label="Nome da conta">
            <input id="cValor" inputmode="decimal" placeholder="1.200,00" aria-label="Valor">
            <input id="cDia" type="number" min="1" max="31" placeholder="dia" aria-label="Dia do vencimento">
            <button class="add" id="cAdd">ok</button>
          </div>
        </div>
      </div>

      <div class="card">
        <header>
          <h2>Dívidas e parcelas</h2>
          <span class="tiny muted num" id="totalDividas"></span>
        </header>
        <div id="listaDividas"></div>
        <div class="mini">
          <button class="abrir" id="abrirDivida">+ Nova dívida</button>
          <div class="l3" id="formDivida" hidden>
            <input id="dNome" placeholder="Cartão / loja" aria-label="Nome da dívida">
            <input id="dValor" inputmode="decimal" placeholder="parcela" aria-label="Valor da parcela">
            <input id="dTotal" type="number" min="1" placeholder="total" aria-label="Total de parcelas">
            <input id="dPagas" type="number" min="0" placeholder="pagas" aria-label="Parcelas já pagas">
            <button class="add" id="dAdd">ok</button>
          </div>
        </div>
      </div>

      <div class="card">
        <header><h2>Renda e reserva</h2></header>
        <div class="corpo">
          <label class="tiny muted" for="renda">Renda de todo mês</label>
          <input id="renda" inputmode="decimal" placeholder="0,00" style="margin:4px 0 14px">
          <label class="tiny muted" for="guardar">Quero guardar por mês</label>
          <input id="guardar" inputmode="decimal" placeholder="0,00" style="margin-top:4px">
        </div>
        <ul id="listaExtras"></ul>
        <div class="mini">
          <button class="abrir" id="abrirExtra">+ Entrada extra deste mês</button>
          <div class="l" id="formExtra" hidden style="grid-template-columns:1fr 92px 44px">
            <input id="eNome" placeholder="Freela, 13º…" aria-label="Descrição da entrada">
            <input id="eValor" inputmode="decimal" placeholder="0,00" aria-label="Valor">
            <button class="add" id="eAdd">ok</button>
          </div>
        </div>
      </div>

      <div class="card">
        <header><h2>Seus dados</h2></header>
        <div class="corpo">
          <p class="tiny muted" style="margin:0 0 12px" id="ondeSalva"></p>

          <div id="nuvemConectar" hidden style="margin-bottom:12px">
            <button class="add" id="abrirNuvem" style="width:100%">Sincronizar com o Google Drive</button>
            <div id="nuvemForm" hidden style="display:grid; gap:8px; margin-top:10px">
              <input id="nUrl" placeholder="https://script.google.com/macros/s/…/exec" aria-label="Endereço do app do Apps Script">
              <div style="display:grid; grid-template-columns:1fr auto; gap:8px">
                <input id="nChave" placeholder="chave secreta" aria-label="Chave secreta" autocomplete="off">
                <button class="ghost" id="nGerar">gerar</button>
              </div>
              <button class="add" id="nConectar">Conectar</button>
              <span class="tiny muted">Passo a passo no README do repositório, em “Sincronizar com o Google Drive”.</span>
            </div>
          </div>

          <div class="linha-botoes" id="nuvemConectado" hidden style="margin-bottom:10px">
            <button class="ghost" id="nLink">Copiar link para o celular</button>
            <button class="ghost" id="nSair">Desconectar</button>
          </div>

          <div class="linha-botoes">
            <button class="ghost" id="sincronizar">Buscar atualizações</button>
            <button class="ghost" id="backup">Exportar cópia</button>
            <button class="ghost" id="restaurar">Importar</button>
            <input type="file" id="arquivo" accept="application/json" hidden>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="aviso" id="aviso" role="status" hidden><span id="avisoTxt"></span><button id="avisoDesfazer">Desfazer</button></div>

<script>
const CATS = [
  {id:'mercado',   nome:'Mercado',     cor:'#3C7A6B'},
  {id:'comidafora',nome:'Comida fora', cor:'#C08A3E'},
  {id:'transporte',nome:'Transporte',  cor:'#4A6FA5'},
  {id:'casa',      nome:'Casa',        cor:'#8A6D9C'},
  {id:'saude',     nome:'Saúde',       cor:'#C06B6B'},
  {id:'lazer',     nome:'Lazer',       cor:'#5F8FA8'},
  {id:'outros',    nome:'Outros',      cor:'#7C8794'},
];
const catDe = g => CATS.some(c => c.id === g.cat) ? g.cat : 'outros';   // categoria desconhecida conta como Outros
const CHAVE = 'painel-financas-v1';
const brl = v => new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid = () => Math.random().toString(36).slice(2,9);
const dec = v => (v||0).toFixed(2).replace('.',',');
const num = t => {
  if(t==null) return 0;
  const s = String(t).replace(/[^\d,.-]/g,'').replace(/\.(?=\d{3}\b)/g,'').replace(',','.');
  const n = parseFloat(s); return isNaN(n) ? 0 : n;
};
const $ = id => document.getElementById(id);
const avisar = (t, ms=1800) => {
  $('estado').textContent = t;
  if(ms) setTimeout(()=>{ if($('estado').textContent===t) $('estado').textContent=''; }, ms);
};

const VAZIO = () => ({tema:null, renda:0, guardar:0, contas:[], dividas:[], meses:{}, apagados:{}, atualizadoEm:0});
// números de verdade e listas de verdade, venha o dado de onde vier (arquivo importado, Drive, versão antiga)
const n0 = v => { const n = Number(v); return isFinite(n) ? n : 0; };
const inteiro = (v, min, max) => Math.min(max, Math.max(min, Math.round(n0(v)) || min));
const lista = v => Array.isArray(v) ? v.filter(x => x && typeof x === 'object' && x.id != null) : [];
const MES_OK = /^\d{4}-\d{2}$/;
function completar(e){
  const r = Object.assign(VAZIO(), e && typeof e === 'object' ? e : {});
  r.renda = n0(r.renda); r.guardar = n0(r.guardar); r.atualizadoEm = n0(r.atualizadoEm);
  if(r.tema !== 'claro' && r.tema !== 'escuro') r.tema = null;
  const quando = x => { if(!MES_OK.test(x.desde)) delete x.desde; if(!MES_OK.test(x.ate)) delete x.ate; return x; };
  r.contas = lista(r.contas).map(c => quando({...c, id:String(c.id), nome:String(c.nome||''), valor:n0(c.valor), dia:inteiro(c.dia,1,31)}));
  r.dividas = lista(r.dividas).map(d => {
    const total = inteiro(d.total, 1, 9999);
    return quando({...d, id:String(d.id), nome:String(d.nome||''), valor:n0(d.valor), total, pagas:inteiro(d.pagas,0,total)});
  });
  const meses = r.meses && typeof r.meses === 'object' ? r.meses : {};
  r.meses = {};
  for(const k in meses) if(MES_OK.test(k) && meses[k] && typeof meses[k] === 'object') r.meses[k] = normalizarMes(meses[k]);
  if(!r.apagados || typeof r.apagados !== 'object') r.apagados = {};
  return r;
}
const vazio = e => !e.renda && !e.guardar && !e.contas.length && !e.dividas.length &&
  !Object.values(e.meses||{}).some(m => (m.gastos||[]).length || (m.extras||[]).length);

let estado = VAZIO();
let ref = new Date();
let hojeReal = new Date();   // renovado ao virar o dia com o painel aberto

const chaveMes = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const diasNoMes = d => new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
const ehMesAtual = () => ref.getFullYear()===hojeReal.getFullYear() && ref.getMonth()===hojeReal.getMonth();
const passou = () => ref < new Date(hojeReal.getFullYear(), hojeReal.getMonth(), 1);
const mesAnterior = k => { const [a, m] = k.split('-').map(Number); return chaveMes(new Date(a, m-2, 1)); };
// vencimento no dia 31 cai no último dia dos meses mais curtos
const diaDaConta = c => Math.min(c.dia, diasNoMes(ref));
// contas e dívidas só existem a partir do mês em que foram cadastradas (e até o mês em que foram encerradas)
const vale = (x, k = chaveMes(ref)) => (!x.desde || x.desde <= k) && (!x.ate || k <= x.ate);
const contasAtivas = () => estado.contas.filter(c => vale(c));

function normalizarMes(m){
  const obj = v => v && typeof v === 'object' && !Array.isArray(v) ? v : {};
  m.gastos = lista(m.gastos).map(g => ({...g, id:String(g.id), valor:n0(g.valor), desc:String(g.desc||''), cat:String(g.cat||'outros'), dia:inteiro(g.dia,1,31), ordem:n0(g.ordem)}));
  m.extras = lista(m.extras).map(x => ({...x, id:String(x.id), nome:String(x.nome||''), valor:n0(x.valor)}));
  m.pagas = Array.isArray(m.pagas) ? m.pagas.map(String) : [];
  m.valores = obj(m.valores); m.pagoEm = obj(m.pagoEm);
  for(const k in m.valores) m.valores[k] = n0(m.valores[k]);
  for(const k in m.pagoEm) m.pagoEm[k] = inteiro(m.pagoEm[k], 1, 31);
  if(Array.isArray(m.parcelas)){ const o = {}; m.parcelas.forEach(id => o[id] = (o[id]||0)+1); m.parcelas = o; }
  m.parcelas = obj(m.parcelas);
  for(const k in m.parcelas) m.parcelas[k] = inteiro(m.parcelas[k], 0, 9999);
  return m;
}
function mes(k){
  k = k || chaveMes(ref);
  if(!estado.meses[k]) estado.meses[k] = normalizarMes({});   // os que já existem vieram de completar()
  return estado.meses[k];
}
// só lê: não cria o mês à toa
const mesSeExiste = k => estado.meses[k] || normalizarMes({});
function apagar(id){ estado.apagados ||= {}; estado.apagados[id] = Date.now(); }

/* ================= armazenamento neste aparelho =================
   Dentro do Claude: window.storage (fica na conta Claude).
   Publicado: localStorage do navegador, e o Drive por cima, se conectado. */
const NA_CLAUDE = !!(window.storage && typeof window.storage.get === 'function');
let LS = null;
if(!NA_CLAUDE){ try{ LS = window.localStorage; LS.setItem('__t','1'); LS.removeItem('__t'); }catch(e){ LS = null; } }
const loc = {
  get(k){ try{ return LS ? LS.getItem(k) : null; }catch(e){ return null; } },
  set(k,v){ try{ if(LS) LS.setItem(k,v); }catch(e){} },
  del(k){ try{ if(LS) LS.removeItem(k); }catch(e){} }
};
const armazem = NA_CLAUDE ? {
  async ler(k){ try{ const r = await window.storage.get(k); return r && r.value ? r.value : null; }catch(e){ return null; } },
  async gravar(k,v){ await window.storage.set(k,v); }
} : LS ? {
  async ler(k){ return loc.get(k); },
  async gravar(k,v){ LS.setItem(k,v); }
} : (() => { const mem = new Map(); return { async ler(k){ return mem.get(k)||null; }, async gravar(k,v){ mem.set(k,v); } }; })();

async function gravarLocal(){
  try{ await armazem.gravar(CHAVE, JSON.stringify(estado)); return true; }catch(e){ return false; }
}
async function carregarLocal(silencioso){
  try{
    const bruto = await armazem.ler(CHAVE);
    if(bruto){
      const vindo = JSON.parse(bruto);
      if(!silencioso || (vindo.atualizadoEm||0) > (estado.atualizadoEm||0)){ estado = completar(vindo); fecharAviso(); return true; }
    }
  }catch(e){}
  return false;
}

let timer, pendente = false, edicoes = 0;
function salvar(){
  fecharAviso();   // depois de outra alteração, desfazer apagaria ela junto
  pendente = true; edicoes++;
  estado.atualizadoEm = Date.now();
  clearTimeout(timer);
  timer = setTimeout(persistir, 400);
}
async function persistir(){
  clearTimeout(timer);
  const ok = await gravarLocal();
  pendente = false;
  if(!ok){ avisar('sem salvar — exporte uma cópia', 6000); return; }
  if(nuvemAtiva()){ setSujo(true); enviar(); } else avisar('salvo');
}

/* ================= Google Drive (via Apps Script) ================= */
const nuvem = {
  cfg: (() => { try{ return JSON.parse(loc.get('painel-nuvem') || 'null'); }catch(e){ return null; } })(),
  base: Number(loc.get('painel-nuvem-base') || 0),
  sujo: loc.get('painel-nuvem-sujo') === '1',
  ocupado: false
};
const nuvemAtiva = () => !NA_CLAUDE && !!LS && !!(nuvem.cfg && nuvem.cfg.url && nuvem.cfg.chave);
const setBase = v => { nuvem.base = v; loc.set('painel-nuvem-base', String(v)); };
const setSujo = v => { nuvem.sujo = v; loc.set('painel-nuvem-sujo', v ? '1' : '0'); };
const MSG_OFF = () => navigator.onLine ? 'Drive fora do ar · salvo aqui' : 'sem internet · salvo aqui';

function marcarNuvem(classe, txt){
  const el = $('nuvem');
  el.hidden = !nuvemAtiva();
  el.className = 'nuvem ' + classe;
  $('nuvemTxt').textContent = txt;
}

async function chamar(corpo, cfg = nuvem.cfg){
  const r = await fetch(cfg.url, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},   // pedido simples: sem pré-verificação de CORS
    body: JSON.stringify(Object.assign({chave: cfg.chave}, corpo))
  });
  if(!r.ok) throw new Error('http');
  const j = await r.json();
  if(j.erro) throw new Error(j.erro);
  return j;
}

// Junta duas versões: nada lançado se perde, e o que foi apagado continua apagado.
function mesclar(a, b){
  a = completar(a); b = completar(b);
  const apag = Object.assign({}, b.apagados, a.apagados);
  const vivo = x => x && !apag[x.id];
  const uniao = (la, lb) => { const m = new Map(); (lb||[]).forEach(x => m.set(x.id, x)); (la||[]).forEach(x => m.set(x.id, x)); return [...m.values()].filter(vivo); };
  const semApagados = o => { const r = {}; for(const k in (o||{})) if(!apag[k]) r[k] = o[k]; return r; };
  const novo = (a.atualizadoEm||0) >= (b.atualizadoEm||0) ? a : b;
  const r = Object.assign(VAZIO(), {
    tema: novo.tema, renda: novo.renda, guardar: novo.guardar, apagados: apag,
    contas: uniao(a.contas, b.contas), dividas: uniao(a.dividas, b.dividas),
    atualizadoEm: Math.max(a.atualizadoEm||0, b.atualizadoEm||0)
  });
  const chaves = new Set([...Object.keys(a.meses), ...Object.keys(b.meses)]);
  for(const k of chaves){
    const ma = normalizarMes(JSON.parse(JSON.stringify(a.meses[k] || {})));
    const mb = normalizarMes(JSON.parse(JSON.stringify(b.meses[k] || {})));
    const [mn, mv] = novo === a ? [ma, mb] : [mb, ma];
    r.meses[k] = {
      gastos: uniao(ma.gastos, mb.gastos),
      extras: uniao(ma.extras, mb.extras),
      pagas: [...new Set([...ma.pagas, ...mb.pagas])].filter(id => !apag[id]),
      valores: semApagados(Object.assign({}, mv.valores, mn.valores)),
      pagoEm: semApagados(Object.assign({}, mv.pagoEm, mn.pagoEm)),
      parcelas: semApagados(Object.assign({}, mv.parcelas, mn.parcelas))
    };
  }
  return r;
}

async function enviar(tentativa = 0){
  if(!nuvemAtiva() || nuvem.ocupado) return;
  if(!navigator.onLine){ marcarNuvem('off', MSG_OFF()); return; }
  nuvem.ocupado = true; marcarNuvem('ocupado', 'sincronizando…');
  const marca = edicoes;
  let repetir = null;
  try{
    const r = await chamar({acao:'gravar', base: nuvem.base, estado});
    if(r.conflito){
      // outro aparelho gravou antes: junta as duas versões e tenta de novo
      estado = mesclar(estado, r.estado || {}); fecharAviso();
      setBase(r.versao); setSujo(true);
      await gravarLocal(); aplicarTema(); renderSeguro();
      if(tentativa < 3) repetir = tentativa + 1;
    }else{
      setBase(r.versao);
      setSujo(edicoes !== marca);
      if(nuvem.sujo) repetir = 0;
      marcarNuvem('ok', 'Drive ✓');
    }
  }catch(e){
    marcarNuvem('off', e.message === 'chave' ? 'chave recusada' : MSG_OFF());
  }finally{
    nuvem.ocupado = false;
  }
  if(repetir !== null) setTimeout(() => enviar(repetir), 250);
}

async function puxar(forcar = false){
  if(!nuvemAtiva() || nuvem.ocupado || pendente) return false;
  if(nuvem.sujo){ await enviar(); return true; }
  if(!navigator.onLine){ marcarNuvem('off', MSG_OFF()); return false; }
  nuvem.ocupado = true;
  const marca = edicoes;
  let mudou = false, reenviar = false;
  try{
    const v = await chamar({acao:'versao'});
    if(v.versao !== nuvem.base || forcar){
      marcarNuvem('ocupado', 'sincronizando…');
      const r = await chamar({acao:'ler'});
      const remoto = completar(r.estado);
      if(edicoes !== marca || pendente){
        estado = mesclar(estado, remoto); setSujo(true); reenviar = true;
      }else if(!vazio(remoto)){
        estado = remoto;
      }else if(!vazio(estado)){
        setSujo(true); reenviar = true;       // arquivo do Drive sumiu: sobe o que tem aqui
      }
      setBase(r.versao);
      await gravarLocal();
      mudou = true;
    }
    marcarNuvem('ok', 'Drive ✓');
  }catch(e){
    marcarNuvem('off', e.message === 'chave' ? 'chave recusada' : MSG_OFF());
  }finally{
    nuvem.ocupado = false;
  }
  if(mudou){ fecharAviso(); aplicarTema(); renderSeguro(); }
  if(reenviar) await enviar();
  return mudou;
}

async function conectar(cfg){
  cfg = {url: String(cfg.url||'').trim(), chave: String(cfg.chave||'').trim()};
  if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(cfg.url)){ avisar('o endereço precisa terminar em /exec', 5000); return false; }
  if(cfg.chave.length < 16){ avisar('use uma chave longa — toque em “gerar”', 5000); return false; }
  avisar('conectando…', 0);
  try{
    const r = await chamar({acao:'ler'}, cfg);
    nuvem.cfg = cfg; loc.set('painel-nuvem', JSON.stringify(cfg));
    const remoto = completar(r.estado);
    if(vazio(remoto)){ setSujo(true); }
    else if(vazio(estado)){ estado = remoto; setSujo(false); }
    else { estado = mesclar(estado, remoto); setSujo(true); }
    setBase(r.versao);
    await gravarLocal();
    aplicarTema(); render(); atualizarPainelNuvem();
    if(nuvem.sujo) await enviar(); else marcarNuvem('ok', 'Drive ✓');
    avisar('Drive conectado', 3000);
    return true;
  }catch(e){
    avisar(e.message === 'chave' ? 'a chave não confere com a do Apps Script' : 'não consegui falar com o Apps Script — confira o endereço', 6000);
    return false;
  }
}

function atualizarPainelNuvem(){
  const ativa = nuvemAtiva();
  $('nuvemConectar').hidden = NA_CLAUDE || !LS || ativa;
  $('nuvemConectado').hidden = !ativa;
  $('nuvem').hidden = !ativa;
  $('ondeSalva').textContent =

    : !LS ? 'Este navegador está bloqueando o armazenamento: nada fica salvo ao fechar a aba. Exporte uma cópia antes de sair.'
    : ativa ? 'Sincronizado com o arquivo painel-financas.json no seu Google Drive. Cada alteração sobe em segundos e os outros aparelhos puxam sozinhos. Sem internet, fica salvo aqui e sobe quando a conexão voltar.'
    : 'Salvo sozinho neste navegador. Conecte ao Google Drive para ter os mesmos dados no computador e no celular.';
}

async function lerLinkDeConexao(){

// não redesenha a tela enquanto você digita num campo
let renderAdiado = false;
const digitando = () => { const a = document.activeElement; return a && (a.tagName === 'INPUT' || a.tagName === 'SELECT') && a.type !== 'file'; };
function renderSeguro(){ if(digitando()){ renderAdiado = true; heroi(); return; } render(); }
document.addEventListener('focusout', () => {
  if(renderAdiado) setTimeout(() => { if(!digitando()){ renderAdiado = false; render(); } }, 0);
});

setInterval(() => { if(document.visibilityState === 'visible') puxar(); }, 15000);
// virou o dia com o painel aberto: "hoje", dias que faltam e atrasos andam junto
function conferirDia(){
  const agora = new Date();
  if(agora.toDateString() === hojeReal.toDateString()) return;
  const estavaNoAtual = ehMesAtual();
  hojeReal = agora;
  if(estavaNoAtual) ref = new Date(agora.getFullYear(), agora.getMonth(), 1);

}
setInterval(conferirDia, 60000);
document.addEventListener('visibilitychange', async () => {

window.addEventListener('offline', () => { if(nuvemAtiva()) marcarNuvem('off', MSG_OFF()); });

/* ================= tema ================= */
function aplicarTema(){
  const escuro = estado.tema == null ? matchMedia('(prefers-color-scheme: dark)').matches : estado.tema === 'escuro';
  document.body.classList.toggle('escuro', escuro);
  $('iconeTema').textContent = escuro ? '☀' : '☾';
}
$('btnTema').onclick = () => {
  estado.tema = document.body.classList.contains('escuro') ? 'claro' : 'escuro';
  aplicarTema(); salvar();
};

/* ================= cálculos ================= */
const valorConta = (c, m) => (m.valores && m.valores[c.id] != null) ? m.valores[c.id] : c.valor;
function contasDoMes(){ const m = mes(); return contasAtivas().reduce((s,c)=>s+valorConta(c,m),0); }
function pagasAntes(d){
  return Object.values(estado.meses).reduce((s,mm)=>{
    const p = mm.parcelas;
    if(Array.isArray(p)) return s + p.filter(x=>x===d.id).length;
    return s + ((p && p[d.id]) || 0);
  }, 0);
}
function restantes(d){ return Math.max(0, d.total - d.pagas - pagasAntes(d)); }
function pagasTotal(d){ return d.total - restantes(d); }
function qtdNoMes(d){ return mes().parcelas[d.id] || 0; }
// último mês em que alguma parcela desta dívida foi marcada
function ultimoMesPago(d){
  return Object.keys(estado.meses).filter(k => (estado.meses[k].parcelas||{})[d.id] > 0).sort().pop() || '';
}
// quitada: aparece até o mês da última parcela e some dos meses seguintes
function dividasAtivas(){
  const k = chaveMes(ref);
  return estado.dividas.filter(d => vale(d) && (restantes(d) > 0 || qtdNoMes(d) > 0 || k <= (ultimoMesPago(d) || d.desde || '')));
}
function parcelasDoMes(){
  return dividasAtivas().reduce((s,d)=>{
    const q = qtdNoMes(d);
    if(q > 0) return s + q*d.valor;
    return s + (restantes(d) > 0 ? d.valor : 0);
  }, 0);
}
function rendaDoMes(){ return estado.renda + mes().extras.reduce((s,e)=>s+e.valor,0); }
function gastosDoMes(){ return mes().gastos.reduce((s,g)=>s+g.valor,0); }
function diasQueFaltam(){
  if(passou()) return 0;
  if(!ehMesAtual()) return diasNoMes(ref);
  return diasNoMes(ref) - hojeReal.getDate() + 1;
}

/* ================= render ================= */
let diaDoForm = '';   // mês+dia que o campo "dia" está mostrando
function render(){
  $('rotuloMes').textContent = ref.toLocaleDateString('pt-BR',{month:'long', year:'numeric'});
  heroi(); fita(); listarGastos(); categorias(); listarContas(); listarDividas(); listarExtras();
  $('renda').value = estado.renda ? dec(estado.renda) : '';
  $('guardar').value = estado.guardar ? dec(estado.guardar) : '';
  // o dia escolhido fica entre um lançamento e outro; só volta para hoje ao trocar de mês ou virar o dia
  const marca = chaveMes(ref) + '/' + hojeReal.getDate();
  if(diaDoForm !== marca && !editando.gasto){ diaDoForm = marca; $('gDia').value = ehMesAtual() ? hojeReal.getDate() : 1; }
  $('gDia').max = diasNoMes(ref);
}
function resumoTopo(){ heroi(); fita(); $('totalContas').textContent = brl(contasDoMes()); }

function heroi(){
  const renda = rendaDoMes(), fixas = contasDoMes(), parc = parcelasDoMes();
  const guardar = estado.guardar, gastos = gastosDoMes();
  const livre = renda - fixas - parc - guardar - gastos;
  const dias = diasQueFaltam();

  $('livre').textContent = brl(livre);
  $('livre').classList.toggle('neg', livre < 0);
  $('heroLabel').textContent = !renda
    ? 'Comece informando sua renda, em “Renda e reserva”'
    : (livre < 0 ? 'Você passou do que tinha para o mês' : 'Livre para gastar até o fim do mês');

  if(dias > 0){
    $('porDiaLabel').textContent = `Por dia, nos ${dias} ${dias===1?'dia que falta':'dias que faltam'}`;
    $('porDia').textContent = brl(Math.max(0, livre)/dias);
  }else{
    $('porDiaLabel').textContent = 'Mês encerrado';
    $('porDia').textContent = (livre>=0 ? 'sobrou ' : 'faltou ') + brl(Math.abs(livre));
  }

  const base = Math.max(renda, fixas+parc+guardar+gastos, 1);
  const pedacos = [
    {v:fixas,   cor:'#5C8F97', nome:'Contas fixas'},
    {v:parc,    cor:'#8FAFA9', nome:'Parcelas'},
    {v:gastos,  cor:'#D9B26A', nome:'Dia a dia'},
    {v:guardar, cor:'#7FD8BC', nome:'Guardar'},
  ].filter(p=>p.v>0);
  $('barra').innerHTML = pedacos.map(p=>`<i style="width:${(p.v/base*100).toFixed(2)}%;background:${p.cor}"></i>`).join('');
  $('legenda').innerHTML = pedacos.map(p=>`<span><i class="dot" style="background:${p.cor}"></i>${p.nome} ${brl(p.v)}</span>`).join('')
    + (renda ? `<span>Renda ${brl(renda)}</span>` : '');
}

function fita(){
  const n = diasNoMes(ref), m = mes();
  const porDia = Array(n+1).fill(0);
  m.gastos.forEach(g => { if(g.dia>=1 && g.dia<=n) porDia[g.dia] += g.valor; });
  const pico = Math.max(...porDia, 1);
  const hoje = ehMesAtual() ? hojeReal.getDate() : -1;
  const corte = ehMesAtual() ? hoje : (passou() ? 99 : 0);   // antes deste dia, conta não paga está atrasada
  const ativas = contasAtivas();

  $('dias').innerHTML = Array.from({length:n}, (_,i)=>{
    const d=i+1, alt = porDia[d] ? Math.max(4, porDia[d]/pico*100) : 2;
    return `<div class="dia ${d===hoje?'hoje':''}" title="dia ${d}: ${brl(porDia[d])}"><div class="b" style="height:${alt}%"></div></div>`;
  }).join('');

  $('marcas').innerHTML = Array.from({length:n}, (_,i)=>{
    const d=i+1, contas = ativas.filter(c=>diaDaConta(c)===d);
    if(!contas.length) return '<div class="marca"></div>';
    const todasPagas = contas.every(c=>m.pagas.includes(c.id));
    const atrasada = !todasPagas && d<corte;
    const cor = todasPagas ? 'var(--pos)' : atrasada ? 'var(--dang)' : 'var(--warn)';
    return `<div class="marca" title="dia ${d}: ${esc(contas.map(c=>c.nome).join(', '))}"><i style="background:${cor}"></i></div>`;
  }).join('');

  $('ultimoDia').textContent = 'dia ' + n;
  const media = hoje>0 ? gastosDoMes()/hoje : gastosDoMes()/n;
  $('fitaResumo').textContent = `${brl(gastosDoMes())} no dia a dia · média de ${brl(media)} por dia`;
}

function listarGastos(){
  const m = mes();
  $('totalGastos').textContent = brl(gastosDoMes());
  if(!m.gastos.length){
    $('listaGastos').innerHTML = '<li class="vazio">Nada lançado neste mês. Comece pelo café, pelo mercado, por qualquer coisa — o painel só serve se refletir o que acontece de verdade.</li>';
    return;
  }
  const ordenado = [...m.gastos].sort((a,b)=> b.dia-a.dia || b.ordem-a.ordem);
  let html='', diaAtual=null;
  for(const g of ordenado){
    if(g.dia !== diaAtual){
      diaAtual = g.dia;
      const soma = m.gastos.filter(x=>x.dia===diaAtual).reduce((s,x)=>s+x.valor,0);
      html += `<li class="dia-cabec num">dia ${diaAtual} · ${brl(soma)}</li>`;
    }
    const c = CATS.find(c=>c.id===catDe(g));
    html += `<li class="item ${editando.gasto===g.id?'editando':''}">
      <i class="cat" style="background:${c.cor}"></i>
      <button class="nome nome-btn" data-editar-gasto="${esc(g.id)}" title="Editar"><span>${esc(g.desc||c.nome)}</span></button>
      <span class="val num">${brl(g.valor)}</span>
      <button class="x" data-del-gasto="${esc(g.id)}" aria-label="Apagar ${esc(g.desc||'gasto')}">×</button>
    </li>`;
  }
  $('listaGastos').innerHTML = html;
}

// diferença contra o mês passado; no mês corrente, compara até o mesmo dia para não comparar meio mês com um mês inteiro
function variacao(agora, antes){
  const d = agora - antes;
  if(Math.abs(d) < 0.005) return '<span class="var">igual</span>';
  return `<span class="var ${d>0?'sobe':'desce'}">${d>0?'▲':'▼'} ${brl(Math.abs(d))}</span>`;
}
function categorias(){
  const m = mes(), total = gastosDoMes();
  const ant = mesSeExiste(mesAnterior(chaveMes(ref)));
  const ateDia = ehMesAtual() ? hojeReal.getDate() : 31;
  const gastosAnt = ant.gastos.filter(g => g.dia <= ateDia);
  const totalAnt = gastosAnt.reduce((s,g)=>s+g.valor,0);
  $('compara').innerHTML = totalAnt ? `${ehMesAtual() ? 'até o dia '+ateDia+', ' : ''}mês passado ${brl(totalAnt)} ${variacao(total, totalAnt)}` : '';
  if(!total){ $('categorias').innerHTML = '<p class="muted tiny" style="margin:0">Assim que você lançar alguns gastos, aqui aparece o ranking por categoria — normalmente é onde mora a surpresa.</p>'; return; }
  const soma = (gs, c) => gs.filter(g=>catDe(g)===c.id).reduce((s,g)=>s+g.valor,0);
  const somas = CATS.map(c=>({...c, v:soma(m.gastos, c), a:soma(gastosAnt, c)}))
                    .filter(c=>c.v>0).sort((a,b)=>b.v-a.v);
  $('categorias').innerHTML = somas.map(c=>`
    <div class="catlinha">
      <span>${c.nome}</span>
      <span class="num muted tiny">${brl(c.v)} · ${Math.round(c.v/total*100)}%${totalAnt ? ' · '+variacao(c.v, c.a) : ''}</span>
      <div class="catbar"><i style="width:${(c.v/somas[0].v*100).toFixed(1)}%;background:${c.cor}"></i></div>
    </div>`).join('');
}

function listarContas(){
  const m = mes(), ativas = contasAtivas();
  $('totalContas').textContent = brl(contasDoMes());
  if(!ativas.length){
    $('listaContas').innerHTML = estado.contas.length
      ? '<div class="vazio">Nenhuma conta fixa valia neste mês.</div>'
      : '<div class="vazio">Cadastre aluguel, luz, internet, escola — tudo que vence todo mês. Elas ficam salvas e reaparecem nos próximos meses.</div>';
    return;
  }
  const hoje = ehMesAtual() ? hojeReal.getDate() : (passou() ? 99 : 0);
  $('listaContas').innerHTML = [...ativas].sort((a,b)=>diaDaConta(a)-diaDaConta(b)).map(c=>{
    const pago = m.pagas.includes(c.id), dia = diaDaConta(c);
    const v = valorConta(c, m);
    const mudou = m.valores[c.id] != null && m.valores[c.id] !== c.valor;
    let tag = `<span class="tag aberto">dia ${dia}</span>`;
    if(pago) tag = `<span class="tag pago">pago${m.pagoEm[c.id] ? ' dia '+m.pagoEm[c.id] : ''}</span>`;
    else if(hoje > dia) tag = '<span class="tag atras">atrasada</span>';
    else if(hoje > 0 && dia === hoje) tag = '<span class="tag vence">vence hoje</span>';
    else if(hoje > 0 && dia-hoje <= 5) tag = `<span class="tag vence">vence em ${dia-hoje}d</span>`;
    const encerra = temHistorico(c);
    return `<div class="conta-linha ${editando.conta===c.id?'editando':''}">
      <button class="check" data-pagar="${esc(c.id)}" aria-pressed="${pago}" aria-label="Marcar ${esc(c.nome)} como paga">
        <svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 6.2l2.6 2.6L10 3.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button class="nome nome-btn" data-editar-conta="${esc(c.id)}" title="Editar nome, valor normal e dia">
        <span>${esc(c.nome)}</span>
        ${mudou ? `<span class="sub-nome">normal ${brl(c.valor)}</span>` : ''}
      </button>
      ${tag}
      <input class="editavel" inputmode="decimal" value="${dec(v)}" data-valor-conta="${esc(c.id)}" aria-label="Valor de ${esc(c.nome)} neste mês">
      <button class="x" data-del-conta="${esc(c.id)}" title="${encerra ? 'Encerrar a partir deste mês' : 'Remover'}" aria-label="${encerra ? 'Encerrar '+esc(c.nome)+' a partir deste mês' : 'Remover '+esc(c.nome)}">×</button>
    </div>`;
  }).join('');
}

function listarDividas(){
  const ativas = dividasAtivas();
  const saldo = ativas.reduce((s,d)=> s + restantes(d)*d.valor, 0);
  $('totalDividas').textContent = saldo ? 'faltam ' + brl(saldo) : '';
  if(!ativas.length){
    $('listaDividas').innerHTML = estado.dividas.length
      ? '<div class="vazio">Nenhuma parcela correndo neste mês.</div>'
      : '<div class="vazio">Sem dívidas cadastradas. Se tiver parcelas correndo, cadastre: elas entram no cálculo do que sobra e você vê a barra andar até o fim.</div>';
    return;
  }
  $('listaDividas').innerHTML = ativas.map(d=>{
    const q = qtdNoMes(d);
    const pagasAgora = pagasTotal(d);
    const antes = pagasAgora - q;
    const rest = restantes(d);
    const pctAntes = d.total ? antes/d.total*100 : 0;
    const pctAgora = d.total ? q/d.total*100 : 0;
    return `<div class="divida">
      <div class="l1">
        <div class="nome"><span>${esc(d.nome)}</span></div>
        <span class="val num">${brl(d.valor)}${q>1 ? ` <span class="tiny muted">× ${q} = ${brl(q*d.valor)}</span>` : ''}</span>
        <button class="x" data-del-divida="${esc(d.id)}" aria-label="Remover ${esc(d.nome)}">×</button>
      </div>
      <div class="prog">
        <i class="antes" style="width:${pctAntes.toFixed(1)}%"></i>
        <i class="agora" style="width:${pctAgora.toFixed(1)}%"></i>
      </div>
      <div class="l1 tiny muted">
        <span class="num">${pagasAgora} de ${d.total} pagas${rest?` · faltam ${brl(rest*d.valor)}`:''}</span>
        <span style="margin-left:auto"></span>
        ${rest > 0 || q > 0
          ? `<div class="stepper ${q?'ativo':''}">
              <button data-parc-menos="${esc(d.id)}" ${q===0?'disabled':''} aria-label="Menos uma parcela neste mês">−</button>
              <span class="q num">${q===0 ? 'pagar' : q+(q===1?' parcela':' parcelas')}</span>
              <button data-parc-mais="${esc(d.id)}" ${rest===0?'disabled':''} aria-label="Mais uma parcela neste mês">+</button>
            </div>`
          : '<span class="tag pago">quitada</span>'}
      </div>
      ${rest > 0 && q > 0 ? `<div class="tiny muted" style="margin-top:6px">Quitando assim, acaba em ${rest} ${rest===1?'mês':'meses'}.</div>` : ''}
    </div>`;
  }).join('');
}

function listarExtras(){
  const m = mes();
  $('listaExtras').innerHTML = !m.extras.length ? '' : m.extras.map(e=>`
    <li class="item">
      <div class="nome"><span>${esc(e.nome)}</span></div>
      <span class="val num" style="color:var(--pos)">+ ${brl(e.valor)}</span>
      <button class="x" data-del-extra="${esc(e.id)}" aria-label="Remover ${esc(e.nome)}">×</button>
    </li>`).join('');
}

/* ================= ações ================= */
function atualizar(){ render(); salvar(); }

/* ----- desfazer: guarda uma foto do estado antes de apagar ----- */
let fotoDesfazer = null, timerAviso;
function fecharAviso(){ fotoDesfazer = null; clearTimeout(timerAviso); $('aviso').hidden = true; }
function comDesfazer(texto, acao){
  const foto = JSON.stringify(estado);
  acao(); atualizar();             // atualizar() → salvar() fecha o aviso anterior
  fotoDesfazer = foto;
  $('avisoTxt').textContent = texto; $('aviso').hidden = false;
  clearTimeout(timerAviso); timerAviso = setTimeout(fecharAviso, 8000);
}
$('avisoDesfazer').onclick = () => {
  if(!fotoDesfazer) return;
  estado = completar(JSON.parse(fotoDesfazer));
  fecharAviso(); cancelarEdicao(); atualizar(); avisar('desfeito');
};

/* ----- edição: os mesmos formulários servem para lançar e para corrigir ----- */
const editando = {gasto:null, conta:null};
function cancelarEdicao(){
  const {gasto, conta} = editando;
  editando.gasto = editando.conta = null;
  $('gEditando').hidden = true; $('gAdd').textContent = 'Lançar';
  $('cAdd').textContent = 'ok'; $('abrirConta').textContent = '+ Nova conta fixa';
  if(gasto){ $('gValor').value = $('gDesc').value = ''; diaDoForm = ''; listarGastos(); }
  if(conta){ ['cNome','cValor','cDia'].forEach(i=>$(i).value=''); $('formConta').hidden = true; listarContas(); }
}
function editarGasto(id){
  const g = mes().gastos.find(x=>x.id===id); if(!g) return;
  cancelarEdicao(); editando.gasto = id;
  $('gValor').value = dec(g.valor); $('gDesc').value = g.desc; $('gCat').value = catDe(g); $('gDia').value = g.dia;
  $('gAdd').textContent = 'Salvar'; $('gEditando').hidden = false;
  listarGastos();
  $('gValor').scrollIntoView({block:'center', behavior:'smooth'}); $('gValor').focus(); $('gValor').select();
}
function editarConta(id){
  const c = estado.contas.find(x=>x.id===id); if(!c) return;
  cancelarEdicao(); editando.conta = id;
  $('cNome').value = c.nome; $('cValor').value = dec(c.valor); $('cDia').value = c.dia;
  $('formConta').hidden = false; $('cAdd').textContent = 'salvar'; $('abrirConta').textContent = '× cancelar edição';
  listarContas();
  $('cNome').focus();
}
$('gCancelar').onclick = () => { cancelarEdicao(); render(); };
document.addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  if(editando.gasto || editando.conta){ cancelarEdicao(); render(); }
});

$('gAdd').onclick = () => {
  const v = num($('gValor').value);
  if(!v){ $('gValor').focus(); return; }
  const dia = Math.min(Math.max(1, parseInt($('gDia').value)||1), diasNoMes(ref));
  const dados = {valor:v, desc:$('gDesc').value.trim(), cat:$('gCat').value, dia};
  const g = editando.gasto && mes().gastos.find(x=>x.id===editando.gasto);
  if(g){ Object.assign(g, dados); cancelarEdicao(); avisar('gasto corrigido'); }
  else mes().gastos.push({id:uid(), ...dados, ordem:Date.now()});
  $('gValor').value=''; $('gDesc').value='';
  atualizar(); $('gValor').focus();
};
['gValor','gDesc'].forEach(id=>$(id).addEventListener('keydown', e=>{ if(e.key==='Enter') $('gAdd').click(); }));

$('cAdd').onclick = () => {
  const nome = $('cNome').value.trim(), v = num($('cValor').value);
  if(!nome || !v) return;
  const dia = Math.min(Math.max(1,parseInt($('cDia').value)||1),31);
  const c = editando.conta && estado.contas.find(x=>x.id===editando.conta);
  if(c){
    if(v !== c.valor){
      // valor normal novo vale daqui para a frente: os meses anteriores ficam com o valor antigo
      const k = chaveMes(ref);
      for(const kk in estado.meses){
        const mm = estado.meses[kk];
        if(kk < k && vale(c, kk) && mm.valores[c.id] == null) mm.valores[c.id] = c.valor;
      }
      const m = mes();
      if(!m.pagas.includes(c.id) && m.valores[c.id] === c.valor) delete m.valores[c.id];
    }
    Object.assign(c, {nome, valor:v, dia});
    cancelarEdicao(); avisar('conta corrigida');
  }else{
    estado.contas.push({id:uid(), nome, valor:v, dia, desde:chaveMes(ref)});
  }
  $('cNome').value=''; $('cValor').value=''; $('cDia').value='';
  atualizar();
};
$('dAdd').onclick = () => {
  const nome = $('dNome').value.trim(), v = num($('dValor').value);
  const total = parseInt($('dTotal').value)||0, pagas = parseInt($('dPagas').value)||0;
  if(!nome || !v || total < 1) return;
  estado.dividas.push({id:uid(), nome, valor:v, total, pagas:Math.max(0, Math.min(pagas,total)), desde:chaveMes(ref)});
  ['dNome','dValor','dTotal','dPagas'].forEach(i=>$(i).value='');
  atualizar();
};
$('eAdd').onclick = () => {
  const nome = $('eNome').value.trim(), v = num($('eValor').value);
  if(!nome || !v) return;
  mes().extras.push({id:uid(), nome, valor:v});
  $('eNome').value=''; $('eValor').value='';
  atualizar();
};
// Enter também confirma os formulários pequenos
[['cNome','cValor','cDia','cAdd'], ['dNome','dValor','dTotal','dPagas','dAdd'], ['eNome','eValor','eAdd']].forEach(ids => {
  const botao = ids.pop();
  ids.forEach(id => $(id).addEventListener('keydown', e => { if(e.key==='Enter') $(botao).click(); }));
});

// conta que já valia em meses anteriores é encerrada (some daqui em diante); senão, é apagada
const temHistorico = c => { const k = chaveMes(ref); return c.desde ? c.desde < k : Object.keys(estado.meses).some(kk => kk < k); };
const nomeMes = () => ref.toLocaleDateString('pt-BR',{month:'long'});

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  const m = mes(), ds = b.dataset;
  if(ds.editarGasto) editarGasto(ds.editarGasto);
  if(ds.editarConta) editarConta(ds.editarConta);
  if(ds.delGasto){
    const g = m.gastos.find(x=>x.id===ds.delGasto);
    if(editando.gasto === ds.delGasto) cancelarEdicao();
    comDesfazer(`Gasto apagado: ${g ? (g.desc || brl(g.valor)) : ''}`, () => { apagar(ds.delGasto); m.gastos = m.gastos.filter(g=>g.id!==ds.delGasto); });
  }
  if(ds.delExtra){
    comDesfazer('Entrada apagada', () => { apagar(ds.delExtra); m.extras = m.extras.filter(x=>x.id!==ds.delExtra); });
  }
  if(ds.delConta){
    const id = ds.delConta, c = estado.contas.find(x=>x.id===id); if(!c) return;
    if(editando.conta === id) cancelarEdicao();
    if(temHistorico(c)){
      comDesfazer(`${c.nome}: encerrada a partir de ${nomeMes()}`, () => { c.ate = mesAnterior(chaveMes(ref)); });
    }else comDesfazer(`${c.nome}: removida`, () => {
      apagar(id);
      estado.contas = estado.contas.filter(c=>c.id!==id);
      Object.values(estado.meses).forEach(mm=>{
        mm.pagas = (mm.pagas||[]).filter(p=>p!==id);
        if(mm.valores) delete mm.valores[id];
        if(mm.pagoEm) delete mm.pagoEm[id];
      });
    });
  }
  if(ds.delDivida){
    const id = ds.delDivida, d = estado.dividas.find(x=>x.id===id);
    comDesfazer(`${d ? d.nome : 'Dívida'}: removida`, () => {
      apagar(id);
      estado.dividas = estado.dividas.filter(d=>d.id!==id);
      Object.values(estado.meses).forEach(mm=>{
        if(Array.isArray(mm.parcelas)) mm.parcelas = mm.parcelas.filter(p=>p!==id);
        else if(mm.parcelas) delete mm.parcelas[id];
      });
    });
  }
  if(ds.pagar){
    if(m.pagas.includes(ds.pagar)){
      m.pagas = m.pagas.filter(p=>p!==ds.pagar);
      delete m.pagoEm[ds.pagar];
    }else{
      m.pagas.push(ds.pagar);
      const c = estado.contas.find(c=>c.id===ds.pagar);
      m.pagoEm[ds.pagar] = ehMesAtual() ? hojeReal.getDate() : (c ? diaDaConta(c) : 1);
      if(c && m.valores[c.id] == null) m.valores[c.id] = c.valor;
    }
    atualizar();
  }
  if(ds.parcMais){
    const d = estado.dividas.find(x=>x.id===ds.parcMais);
    if(d && restantes(d) > 0){ m.parcelas[d.id] = (m.parcelas[d.id]||0) + 1; atualizar(); }
  }
  if(ds.parcMenos){
    const id = ds.parcMenos;
    if(m.parcelas[id]){ m.parcelas[id]--; if(!m.parcelas[id]) delete m.parcelas[id]; atualizar(); }
  }
});

document.addEventListener('input', e => {
  const id = e.target.dataset && e.target.dataset.valorConta;
  if(!id) return;
  mes().valores[id] = num(e.target.value);
  resumoTopo(); salvar();
});
document.addEventListener('blur', e => {
  const id = e.target.dataset && e.target.dataset.valorConta;
  if(!id) return;
  e.target.value = dec(num(e.target.value));
  setTimeout(() => { if(!digitando()) listarContas(); }, 0);
}, true);

$('renda').addEventListener('input', e => { estado.renda = num(e.target.value); heroi(); salvar(); });
$('guardar').addEventListener('input', e => { estado.guardar = num(e.target.value); heroi(); salvar(); });
$('renda').addEventListener('blur', e => e.target.value = estado.renda ? dec(estado.renda) : '');
$('guardar').addEventListener('blur', e => e.target.value = estado.guardar ? dec(estado.guardar) : '');

const alternar = (form, foco) => { $(form).hidden = !$(form).hidden; if(!$(form).hidden) $(foco).focus(); };
$('abrirConta').onclick  = () => {
  if(editando.conta){ cancelarEdicao(); render(); return; }
  alternar('formConta', 'cNome');
};
$('abrirDivida').onclick = () => alternar('formDivida', 'dNome');
$('abrirExtra').onclick  = () => alternar('formExtra', 'eNome');
$('abrirNuvem').onclick  = () => alternar('nuvemForm', 'nUrl');

$('ant').onclick  = () => { ref = new Date(ref.getFullYear(), ref.getMonth()-1, 1); render(); };
$('prox').onclick = () => { ref = new Date(ref.getFullYear(), ref.getMonth()+1, 1); render(); };
$('hoje').onclick = () => { ref = new Date(hojeReal.getFullYear(), hojeReal.getMonth(), 1); render(); };

/* ----- conexão com o Drive ----- */
$('nGerar').onclick = async () => {
  const a = new Uint8Array(24); crypto.getRandomValues(a);
  const k = Array.from(a, b => b.toString(16).padStart(2,'0')).join('');
  $('nChave').value = k;
  try{ await navigator.clipboard.writeText(k); avisar('chave copiada — cole no Apps Script', 5000); }
  catch(e){ avisar('chave gerada — copie do campo', 5000); }
};
$('nConectar').onclick = () => conectar({url: $('nUrl').value, chave: $('nChave').value});
$('nLink').onclick = async () => {
  const cod = encodeURIComponent(btoa(JSON.stringify(nuvem.cfg)));
  const link = location.origin + location.pathname + '#conectar=' + cod;
  try{ await navigator.clipboard.writeText(link); avisar('link copiado — abra no celular', 5000); }
  catch(e){ prompt('Copie este link e abra no celular:', link); }
};
$('nSair').onclick = () => {
  if(!confirm('Desconectar este aparelho do Drive? Os dados continuam aqui e no Drive.')) return;
  nuvem.cfg = null; setBase(0); setSujo(false);
  loc.del('painel-nuvem'); loc.del('painel-nuvem-base'); loc.del('painel-nuvem-sujo');
  atualizarPainelNuvem(); avisar('desconectado');
};
$('nuvem').onclick = () => puxar(true);
$('sincronizar').onclick = async () => {
  if(pendente){ avisar('salvando…'); return; }
  if(nuvemAtiva()){ avisar((await puxar(true)) ? 'atualizado' : 'já está em dia'); return; }
  if(await carregarLocal(true)){ aplicarTema(); render(); avisar('atualizado'); }
  else avisar('já está em dia');
};

/* ----- cópia de segurança ----- */
$('backup').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(estado,null,2)],{type:'application/json'}));
  a.download = 'financas-' + chaveMes(hojeReal) + '.json';
  a.click(); URL.revokeObjectURL(a.href);
};
$('restaurar').onclick = () => $('arquivo').click();
$('arquivo').onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const vindo = completar(JSON.parse(r.result));
      estado = vazio(estado) ? vindo : mesclar(vindo, estado);
      aplicarTema(); atualizar(); avisar('importado');
    }catch(err){ avisar('arquivo inválido', 4000); }
  };
  r.readAsText(f);
  e.target.value = '';
};

/* ================= início ================= */
$('gCat').innerHTML = CATS.map(c=>`<option value="${c.id}">${c.nome}</option>`).join('');
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if(estado.tema == null) aplicarTema(); });

if('serviceWorker' in navigator && location.protocol === 'https:' && !NA_CLAUDE){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}

(async () => {
  await carregarLocal(); aplicarTema(); render(); atualizarPainelNuvem();
  await lerLinkDeConexao();
  if(nuvemAtiva()){ marcarNuvem('ocupado', 'sincronizando…'); puxar(); }
})();
</script>
