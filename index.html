<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Septim</title>
<meta name="theme-color" content="#2A1748">
<link rel="icon" href="img/icone-192.png" type="image/png">
<link rel="apple-touch-icon" href="img/icone-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/app.css">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js" defer></script>
</head>
<body>
<div class="app">
  <aside class="lateral" id="lateral">
    <a class="marca" href="#/dashboard"><i class="logo" aria-hidden="true"></i><span>Septim</span></a>
    <nav id="menu" aria-label="Menu principal"></nav>
    <div class="perfil" id="perfil"></div>
  </aside>
  <div class="fundo-menu" id="fundoMenu" hidden></div>

  <div class="principal">
    <header class="topo">
      <button class="icone-btn so-celular" id="abrirMenu" aria-label="Abrir menu"><i data-lucide="menu" class="ic"></i></button>
      <div class="titulo-pagina"><h1 id="tituloPagina">Dashboard</h1><p id="subPagina"></p></div>
      <div class="topo-acoes">
        <button class="nuvem" id="btnNuvem" hidden title="Sincronizar agora"><i></i><span>Drive</span></button>
        <button class="icone-btn" id="btnOcultar" aria-label="Ocultar valores" title="Ocultar valores"><i data-lucide="eye" class="ic"></i></button>
        <button class="icone-btn" id="btnTema" aria-label="Alternar tema" title="Tema claro ou escuro"><i data-lucide="moon" class="ic"></i></button>
        <div class="sino-wrap">
          <button class="icone-btn" id="btnAvisos" aria-label="Avisos" aria-expanded="false"><i data-lucide="bell" class="ic"></i><span class="bolinha" id="nAvisos" hidden></span></button>
          <div class="painel-avisos" id="painelAvisos" hidden></div>
        </div>
        <button class="btn primario so-pc" id="btnNovo"><i data-lucide="plus" class="ic"></i>Novo</button>
      </div>
    </header>
    <main id="conteudo" tabindex="-1"></main>
  </div>
</div>

<button class="fab so-celular" id="fab" aria-label="Novo lançamento"><i data-lucide="plus" class="ic"></i></button>
<dialog id="modal"></dialog>
<div class="toast" id="toast" role="status" hidden></div>
<div class="tip" id="tip" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
